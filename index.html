<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingua Arena — 일상에서 쓰는 외국어 학습</title>
<meta name="description" content="영어·프랑스어·독일어·스페인어·한국어·일본어·중국어. A1~C2 단계별 어휘·문법·듣기·읽기·말하기·쓰기를 같은 흐름으로 비교하며 배우는 무료 학습 사이트.">
<meta name="theme-color" content="#16224A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app"></div>
<script src="assets/app.js"></script>
<script>
(function () {
  var L = window.LA;
  var app = document.getElementById('app');

  function card(lang, ready, live, total) {
    var inner = '<span class="native" lang="' + lang.code + '">' + L.esc(lang.native) + '</span>' +
      '<span class="en">' + L.esc(lang.name) + '</span>' +
      '<span class="meta">' + L.esc(ready ? L.t('liveLabel') + ' ' + live + ' / ' + total : L.t('soon')) + '</span>';
    return ready ? '<a class="card" href="lang.html?l=' + lang.code + '">' + inner + '</a>'
                 : '<div class="card soon">' + inner + '</div>';
  }

  function render(c) {
    var total = c.a1_units.length;
    var live = c.a1_units.filter(function (u) { return u.status === 'live'; }).length;
    var html = L.header('');
    html += '<main><div class="wrap">' +
      '<section class="hero"><span class="eyebrow">Seven languages · A1–C2 · six skills</span>' +
      '<h1>' + L.esc(L.t('heroTitle')) + '</h1>' +
      '<p class="sub">' + L.esc(L.t('heroSub')) + '</p></section>';
    ['europe', 'asia'].forEach(function (fam) {
      var langs = c.languages.filter(function (x) { return x.family === fam; });
      html += '<section class="block"><div class="block-head"><h2>' + L.esc(L.pick(c.families[fam])) + '</h2></div><div class="grid">' +
        langs.map(function (x) { return card(x, true, live, total); }).join('') + '</div></section>';
    });
    html += '<section class="block"><div class="block-head"><h2>' + L.esc(L.t('levelsLabel')) + '</h2></div><div class="grid">' +
      c.levels.map(function (lv) {
        return '<div class="card"><span class="native" style="font-size:20px">' + L.esc(lv.id.toUpperCase()) + '</span><span class="en">' +
          L.esc(L.pick(lv.goal)) + '</span></div>';
      }).join('') + '</div></section>';
    html += '</div></main>' + L.footer();
    app.innerHTML = html;
    L.bindToggle(app);
  }

  window.renderPage = function () { L.getJSON('data/concepts.json').then(render).catch(function (e) {
    app.innerHTML = '<div class="empty">' + L.esc(String(e)) + '</div>'; }); };
  window.renderPage();
})();
</script>
</body>
</html>
